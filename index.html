<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Excel Processor</title>

    <style>

        body {

            margin: 0;
            padding: 0;

            font-family: Arial, sans-serif;

            background: #f4f6f9;

            display: flex;
            justify-content: center;
            align-items: center;

            height: 100vh;
        }

        .container {

            background: white;

            padding: 40px;

            border-radius: 15px;

            box-shadow: 0px 5px 20px rgba(0,0,0,0.1);

            width: 400px;

            text-align: center;
        }

        h1 {

            color: #333;
        }

        button {

            background: #007bff;

            color: white;

            border: none;

            padding: 12px 20px;

            border-radius: 8px;

            cursor: pointer;

            margin-top: 20px;
        }

        button:hover {

            background: #0056b3;
        }

        #status {

            margin-top: 20px;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>Excel Processor</h1>

        <p>Upload your Excel file</p>

        <input type="file" id="fileInput">

        <br>

        <button onclick="uploadFile()">
            Upload & Process
        </button>

        <div id="status"></div>

    </div>

    <script>

        async function uploadFile() {

            const fileInput =
                document.getElementById("fileInput");

            const status =
                document.getElementById("status");

            const file = fileInput.files[0];

            if (!file) {

                status.innerText =
                    "Please select a file.";

                return;
            }

            const formData = new FormData();

            formData.append("file", file);

            status.innerText =
                "Processing...";

            try {

                const response = await fetch(
                    "https://excel-processor-131s.onrender.com/process-excel/",
                    {
                        method: "POST",
                        body: formData
                    }
                );

                const blob = await response.blob();

                const url =
                    window.URL.createObjectURL(blob);

                const a =
                    document.createElement("a");

                a.href = url;

                a.download = "processed.xlsx";

                a.click();

                status.innerText =
                    "Completed successfully.";

            }

            catch (error) {

                console.error(error);

                status.innerText =
                    "Error occurred.";
            }
        }

    </script>

</body>

</html>
