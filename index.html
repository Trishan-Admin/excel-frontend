```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel Processor</title>

    <style>

        body {
            font-family: Arial;
            background: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {

            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);

            text-align: center;
        }

        button {

            padding: 10px 20px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {

            background: #0056b3;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>Excel Processor</h1>

        <input type="file" id="fileInput">

        <br><br>

        <button onclick="uploadFile()">
            Upload & Process
        </button>

        <p id="status"></p>

    </div>

    <script>

        async function uploadFile() {

            const fileInput = document.getElementById("fileInput");

            const file = fileInput.files[0];

            if (!file) {

                alert("Please select a file");

                return;
            }

            const formData = new FormData();

            formData.append("file", file);

            document.getElementById("status").innerText =
                "Processing...";

            try {

                const response = await fetch(
                    "https://excel-processor-131s.onrender.com/process-excel/",
                    {
                        method: "POST",
                        body: formData
                    }
                );

                const blob = await response.blob();

                const url = window.URL.createObjectURL(blob);

                const a = document.createElement("a");

                a.href = url;

                a.download = "processed.xlsx";

                a.click();

                document.getElementById("status").innerText =
                    "Completed successfully.";

            }

            catch (error) {

                console.error(error);

                document.getElementById("status").innerText =
                    "Error occurred.";
            }
        }

    </script>

</body>

</html>
```
