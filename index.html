<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Excel Processor</title>

    <style>

        body {

            margin: 0;
            padding: 0;

            font-family: Arial, sans-serif;

            background: #f4f6f9;

            display: flex;
            justify-content: center;
            align-items: center;

            height: 100vh;
        }

        .container {

            background: white;

            padding: 50px;

            border-radius: 20px;

            box-shadow: 0px 10px 30px rgba(0,0,0,0.1);

            width: 420px;

            text-align: center;
        }

        h1 {

            color: #333;

            font-size: 55px;

            margin-bottom: 20px;
        }

        p {

            color: #666;

            font-size: 20px;

            margin-bottom: 35px;
        }

        input[type="file"] {

            margin-bottom: 30px;
        }

        button {

            background: #007bff;

            color: white;

            border: none;

            padding: 15px 30px;

            border-radius: 10px;

            cursor: pointer;

            font-size: 20px;

            transition: 0.3s;
        }

        button:hover {

            background: #0056b3;
        }

        #status {

            margin-top: 25px;

            font-size: 22px;

            font-weight: bold;
        }

        .success {

            color: green;
        }

        .error {

            color: red;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>Excel Processor</h1>

        <p>Upload your Excel file</p>

        <input 
            type="file" 
            id="fileInput"
            accept=".xlsx,.xls,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel"
        >

        <br>

        <button onclick="uploadFile()">
            Upload & Process
        </button>

        <div id="status"></div>

    </div>

    <script>

        async function uploadFile() {

            const fileInput =
                document.getElementById("fileInput");

            const status =
                document.getElementById("status");

            const file = fileInput.files[0];

            if (!file) {

                status.className = "error";

                status.innerText =
                    "Please select an Excel file.";

                return;
            }

            const formData = new FormData();

            formData.append("file", file);

            status.className = "";

            status.innerText =
                "Processing...";

            try {

                const response = await fetch(
                    "https://excel-processor-131s.onrender.com/process-excel/",
                    {
                        method: "POST",
                        body: formData
                    }
                );

                if (!response.ok) {

                    throw new Error(
                        "Server error"
                    );
                }

                const blob =
                    await response.blob();

                const url =
                    window.URL.createObjectURL(blob);

                const a =
                    document.createElement("a");

                a.href = url;

                a.download =
                    "processed.xlsx";

                document.body.appendChild(a);

                a.click();

                a.remove();

                status.className = "success";

                status.innerText =
                    "Completed successfully.";

            }

            catch (error) {

                console.error(error);

                status.className = "error";

                status.innerText =
                    "Error: " + error.message;
            }
        }

    </script>

</body>

</html>
